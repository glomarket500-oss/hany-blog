name: Deploy Blog (Issue Trigger)

on:
  issues:
    types: [opened, labeled]

jobs:
  publish:
    if: contains(github.event.issue.labels.*.name, 'deploy') || contains(github.event.issue.title, '[deploy]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          pip install pillow requests

      - name: Run deploy script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          Z_IMAGE_API_KEY: ${{ secrets.Z_IMAGE_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        run: |
          python scripts/deploy_from_issue.py "${{ github.event.issue.body }}"

      - name: Git push
        run: |
          git config user.name "Hai Ge Bot"
          git config user.email "bot@haige.com"
          git add .
          git commit -m "Auto-deploy from issue #${{ github.event.issue.number }}" || echo "nothing to commit"
          git push origin master

      - name: Comment on issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'deployed to https://glomarket.vercel.app/'
            })
